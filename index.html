<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Resume & Cover Letter Optimizer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #1e293b; text-align: center; font-size: 24px; margin-bottom: 8px; }
    p.subtitle { text-align: center; color: #64748b; margin-bottom: 24px; }
    label { font-weight: 600; display: block; margin-top: 15px; margin-bottom: 5px; color: #334155; }
    textarea, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 120px; resize: vertical; }
    button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 14px; margin-top: 20px; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    .results { margin-top: 30px; display: none; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 15px; }
    .card h3 { margin-top: 0; color: #1e293b; font-size: 16px; }
    .pre-text { white-space: pre-wrap; font-family: inherit; color: #475569; }
  </style>
</head>
<body>

<div class="container">
  <h1>ATS Resume & Cover Letter Optimizer</h1>
  <p class="subtitle">Tailor your application to any job description in seconds for free.</p>

  <label for="apiKey">Enter Your Free Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />

  <label for="jobDesc">Target Job Description:</label>
  <textarea id="jobDesc" placeholder="Paste the full job post here..."></textarea>

  <label for="resume">Your Base Resume:</label>
  <textarea id="resume" placeholder="Paste your current resume here..."></textarea>

  <button onclick="optimizeApplication()">Optimize Application Now</button>

  <div id="results" class="results">
    <div class="card">
      <h3>Missing ATS Keywords</h3>
      <div id="keywords" class="pre-text"></div>
    </div>
    <div class="card">
      <h3>Tailored Bullet Points</h3>
      <div id="bullets" class="pre-text"></div>
    </div>
    <div class="card">
      <h3>Generated Cover Letter</h3>
      <div id="coverLetter" class="pre-text"></div>
    </div>
  </div>
</div>

<script>
async function optimizeApplication() {
  const apiKey = document.getElementById('apiKey').value;
  const jobDesc = document.getElementById('jobDesc').value;
  const resume = document.getElementById('resume').value;

  if (!apiKey || !jobDesc || !resume) {
    alert("Please fill in all fields.");
    return;
  }

  const prompt = `You are an ATS recruitment expert. Analyze this Job Description and Resume.
Provide three sections in plain text formatted exactly like this:

MISSING KEYWORDS:
[List 5-8 missing high-value keywords]

TAILORED BULLET POINTS:
[Rewrite 3-5 resume bullets using Action Verb + Result format containing missing keywords]

COVER LETTER:
[Write a professional 3-paragraph tailored cover letter]

JOB DESCRIPTION:
${jobDesc}

RESUME:
${resume}`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();
    const resultText = data.candidates[0].content.parts[0].text;

    document.getElementById('keywords').innerText = extractSection(resultText, "MISSING KEYWORDS:", "TAILORED BULLET POINTS:");
    document.getElementById('bullets').innerText = extractSection(resultText, "TAILORED BULLET POINTS:", "COVER LETTER:");
    document.getElementById('coverLetter').innerText = extractSection(resultText, "COVER LETTER:", "");

    document.getElementById('results').style.display = 'block';
  } catch (err) {
    alert("Error processing request. Check your API Key.");
  }
}

function extractSection(text, startLabel, endLabel) {
  const startIndex = text.indexOf(startLabel);
  if (startIndex === -1) return "";
  const actualStart = startIndex + startLabel.length;
  if (!endLabel) return text.substring(actualStart).trim();
  const endIndex = text.indexOf(endLabel, actualStart);
  return endIndex === -1 ? text.substring(actualStart).trim() : text.substring(actualStart, endIndex).trim();
}
</script>

</body>
</html>
