<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد السيرة الذاتية وخطاب التغطية</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #1e293b; text-align: center; font-size: 22px; margin-bottom: 8px; }
    p.subtitle { text-align: center; color: #64748b; margin-bottom: 24px; font-size: 14px; }
    label { font-weight: 600; display: block; margin-top: 15px; margin-bottom: 5px; color: #334155; font-size: 14px; }
    textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; font-family: inherit; height: 110px; resize: vertical; }
    button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 14px; margin-top: 20px; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    .results { margin-top: 25px; display: none; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 15px; }
    .card h3 { margin-top: 0; color: #1e293b; font-size: 16px; }
    .pre-text { white-space: pre-wrap; color: #475569; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="container">
  <h1>مساعد السيرة الذاتية وخطاب التغطية لأنظمة ATS</h1>
  <p class="subtitle">قم بتخصيص طلبك لأي وصف شغلي في ثوانٍ مجاناً وبدون الحاجة لإنشاء حساب.</p>

  <label for="jobDesc">وصف الوظيفة المستهدفة:</label>
  <textarea id="jobDesc" placeholder="ألسق إعلان الوظيفة كاملاً هنا..."></textarea>

  <label for="resume">سيرتك الذاتية الأساسية:</label>
  <textarea id="resume" placeholder="ألسق سيرتك الذاتية الحالية هنا..."></textarea>

  <button id="submitBtn" onclick="optimizeApplication()">قم بتحسين التطبيق الآن</button>

  <div id="results" class="results">
    <div class="card">
      <h3>التحليل والتوصيات المخصصة</h3>
      <div id="output" class="pre-text"></div>
    </div>
  </div>
</div>

<script>
async function optimizeApplication() {
  const jobDesc = document.getElementById('jobDesc').value;
  const resume = document.getElementById('resume').value;
  const btn = document.getElementById('submitBtn');

  if (!jobDesc || !resume) {
    alert("يرجى ملء جميع الحقول أولاً.");
    return;
  }

  btn.innerText = "جاري التحليل واستخراج النتائج...";
  btn.disabled = true;

  const prompt = `أنت خبير توظيف وانظمة ATS. قم بتحليل الوصف الوظيفي والسيرة الذاتية التالية واستخرج:
1. الكلمات المفتاحية الناقصة (ATS Keywords)
2. 3 نقاط محسنة للسيرة الذاتية باسلوب الإنجازات
3. خطاب تغطية احترافي قصير (Cover Letter)

الوصف الوظيفي:
${jobDesc}

السيرة الذاتية:
${resume}`;

  try {
    const response = await fetch("https://text.pollinations.ai/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [{ role: "user", content: prompt }]
      })
    });

    const resultText = await response.text();
    document.getElementById('output').innerText = resultText;
    document.getElementById('results').style.display = 'block';
  } catch (err) {
    alert("حدث خطأ أثناء معالجة الطلب، حاول مرة أخرى.");
  } finally {
    btn.innerText = "قم بتحسين التطبيق الآن";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
